<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0; url=index.html">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/site-icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#005baa">
  <title>Semestr III - Materiały PB WE</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: #fff;
      background:
        radial-gradient(circle at 18% 22%, rgba(157, 246, 255, 0.34), transparent 30%),
        radial-gradient(circle at 84% 12%, rgba(250, 204, 21, 0.22), transparent 30%),
        linear-gradient(135deg, #07192f 0%, #123f6c 52%, #005baa 100%);
      font-family: Arial, Helvetica, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.32) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.32) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(180deg, #000 0%, transparent 88%);
    }

    .shell {
      position: relative;
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 0 34px;
    }

    .brand img {
      display: block;
      width: min(270px, 58vw);
      height: auto;
    }

    .top-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .date-badge,
    .semester-badge,
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid rgba(231, 246, 255, 0.24);
      border-radius: 999px;
      color: #d8ecff;
      background: rgba(255, 255, 255, 0.07);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-decoration: none;
      white-space: nowrap;
    }

    .semester-badge {
      color: #07192f;
      background: #9df6ff;
      border-color: rgba(157, 246, 255, 0.8);
    }

    .card {
      min-height: min(680px, calc(100vh - 160px));
      display: grid;
      align-content: center;
      padding: clamp(34px, 8vw, 86px);
      border: 1px solid rgba(231, 246, 255, 0.22);
      border-radius: 22px;
      background:
        radial-gradient(circle at 78% 18%, rgba(157, 246, 255, 0.22), transparent 34%),
        linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
      box-shadow: 0 28px 70px rgba(3, 16, 34, 0.28);
      overflow: hidden;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: #9df6ff;
      font-size: 14px;
      font-weight: 950;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 880px;
      margin: 0;
      font-size: clamp(54px, 10vw, 120px);
      line-height: 0.94;
      letter-spacing: 0;
    }

    p {
      max-width: 760px;
      margin: 28px 0 0;
      color: #d8ecff;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.34;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-height: 50px;
      margin-top: 32px;
      padding: 13px 18px;
      border-radius: 12px;
      color: #07192f;
      background: #9df6ff;
      font-weight: 950;
      text-decoration: none;
    }

    @media (max-width: 760px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-meta {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar" aria-label="Nagłówek">
      <a class="brand" href="index.html">
        <img src="assets/logo-we-pb.svg" alt="Wydział Elektryczny Politechniki Białostockiej">
      </a>
      <div class="top-meta">
        <a class="date-badge" href="semestr-1.html">Semestr I</a>
        <a class="date-badge" href="semestr-2.html">Semestr II</a>
        <a class="semester-badge" href="index.html">Semestr III</a>
        <span class="badge">Jeszcze zamknięte</span>
      </div>
    </nav>

    <section class="card">
      <p class="eyebrow">Wydział Elektryczny PB · semestr III</p>
      <h1>Najpierw wakacje.</h1>
      <p>Semestr III jest teraz na stronie głównej. Później tu zaglądaj, teraz nie bądź wścibski.</p>
      <a class="button" href="index.html">Otwórz stronę główną</a>
    </section>
  </main>
</body>
</html>
